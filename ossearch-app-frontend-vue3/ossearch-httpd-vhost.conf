<VirtualHost *:443>
    ServerName si-prodsearch01.si.edu
    ServerAlias si-prodsearch01

    DocumentRoot /var/www/html/ossearch

    SSLEngine on
    SSLCertificateFile /etc/pki/tls/certs/si-vmprodsearch02.si.edu.crt
    SSLCertificateKeyFile /etc/pki/tls/private/si-vmprodsearch02.si.edu.key

    <Directory /var/www/html/ossearch>
        Options Indexes FollowSymLinks MultiViews
        AllowOverride all
        Require all granted
        Order allow,deny
          allow from all

        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /
            # Route all requests except API requests and build assets to index.html.
            # /static/ is excluded so a missing hashed chunk returns a real 404
            # instead of index.html (which the browser would try to parse as JS,
            # causing "Uncaught SyntaxError: Unexpected token '<'").
            RewriteCond %{REQUEST_URI} !^/(api|actuator|search|static)
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule . /index.html [L]
        </IfModule>

        <IfModule mod_headers.c>
            # index.html must always be revalidated so browsers never hold a
            # stale copy referencing hashed chunks that no longer exist.
            <Files "index.html">
                Header set Cache-Control "no-cache, must-revalidate"
            </Files>
            # Hashed build assets are immutable: a content change produces a
            # new filename, so these can be cached forever.
            <FilesMatch "\.(js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|ico)$">
                Header set Cache-Control "public, max-age=31536000, immutable"
            </FilesMatch>
        </IfModule>
    </Directory>

    # Proxy API requests to Spring Boot backend
    ProxyPass /api http://127.0.0.1:8484/api
    ProxyPassReverse /api http://127.0.0.1:8484/api

    # Proxy API requests to Spring Boot backend
    ProxyPass /actuator http://127.0.0.1:8484/actuator
    ProxyPassReverse /actuator http://127.0.0.1:8484/actuator

    # Additional proxy configurations if needed
    ProxyPass /search http://127.0.0.1:8484/search
    ProxyPassReverse /search http://127.0.0.1:8484/search
</VirtualHost>
